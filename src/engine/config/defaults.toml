# ~/.planar/config.toml — Planar configuration
#
# All keys here are optional. Anything you don't set falls through to the
# embedded defaults shipped in the binary. Run `planar config show --defaults`
# to see the full baseline.
#
# Environment variables override config values. See:
#   planar config show --effective
# for the resolved value of every key plus its provenance.

[defaults]
# Default vendor identity used when $PLANAR_VENDOR is not set.
# Acceptable values today: claude, codex, copilot.
vendor = "claude"

# Default scope when no scope is active. Acceptable: global, repo, association.
scope = "global"

[workbench]
# Per-feature workbench root. $PLANAR_WORKBENCH_ROOT wins if set.
root = "~/.planar/workbench"

[templates]
# Where the user's JSON template files live.
dir = "~/.planar/templates"

# Default template set selected when an association has no override.
default_set = "default"

# Per-vendor model tier maps (plan 540). The canonical tiers are `small`,
# `medium`, and `large`; each maps to a concrete model id for that vendor.
# `planar models` discovers which provider CLIs are installed; these tables are
# the source of truth for which model each tier resolves to. Override any value
# to re-route a tier (e.g. point `medium` at a different model).
[models.claude]
small  = "claude-haiku-4-5"
medium = "claude-sonnet-5"
large  = "claude-opus-4-8"

[models.codex]
small  = "gpt-5.4-mini"
medium = "gpt-5.4"
large  = "gpt-5.5"

[models.copilot]
small  = "gpt-5-mini"
medium = "gpt-5"
large  = "claude-opus-4"

# Work-type routing map (plan 899 D4/D7/D9/D10/D11). Every work type in
# `schema | engine | architectural | cli | feature | mechanical` is a routing
# key that selects one candidate model id from the matching
# `[models.<vendor>.<tier>]` list above. A routed id MUST be a member of that
# tier's candidate list — `planar config validate` rejects a routing entry
# naming a model id absent from the list. The shipped default only routes
# `mechanical` to the tier default (`list[0]`, D11); every other work type is
# left unmapped here and falls back to the tier default until an operator adds
# a routing entry pointing at a different candidate in that tier's list.
[routing.claude.small]
mechanical = "claude-haiku-4-5"

[routing.claude.medium]
mechanical = "claude-sonnet-5"

[routing.claude.large]
mechanical = "claude-opus-4-8"

[routing.codex.small]
mechanical = "gpt-5.4-mini"

[routing.codex.medium]
mechanical = "gpt-5.4"

[routing.codex.large]
mechanical = "gpt-5.5"

[routing.copilot.small]
mechanical = "gpt-5-mini"

[routing.copilot.medium]
mechanical = "gpt-5"

[routing.copilot.large]
mechanical = "claude-opus-4"

# Role → tier mapping (vendor-independent). The shared resolver composes this
# with [models.<vendor>] to pick a concrete model for a role: e.g. the coder
# resolves to the `medium` model of the active vendor, the reviewer to `large`.
# INVARIANT: each entry MUST match the `tier:` frontmatter of the matching
# agents/<role>.md — the agent spec owns the tier (see agents/models.md
# §Conventions). The render path resolves an agent's model from that frontmatter
# directly; this table is the runtime resolver's copy for the built-in roles, so
# a divergence means the runtime resolves a role to a different model than its
# rendered surface advertises.
[roles]
coder      = "medium"
reviewer   = "large"
test-coder = "large"
documenter = "large"
doc-author = "large"
sync-reconciler = "large"

[external.jira]
# Base URL of the Jira instance. Required for ext-sync against Jira.
# base_url = "https://your-org.atlassian.net"
# Env vars to read for HTTP Basic auth. Never put the actual values here.
user_env  = "JIRA_USER"
token_env = "JIRA_TOKEN"

[external.jira.status]
# Map Planar task/plan statuses to your Jira workflow names.
todo    = "To Do"
doing   = "In Progress"
blocked = "Blocked"
done    = "Done"

[external.github-issues]
# Auth resolution. Acceptable: token-env, gh-cli, oauth-stored.
auth      = "gh-cli"
token_env = "GITHUB_TOKEN"           # used only when auth = "token-env"

[external.github-issues.status]
todo  = "open"
doing = "open"
done  = "closed"

[external.github-projects]
# Custom-field name candidates Planar probes when discovering the "parent"
# relationship in a Projects v2 board. First match wins.
parent_field_names = ["Parent", "Initiative", "Tracking"]

[introspection]
# Opt-in local CLI usage log. When true, one row per top-level `planar`
# invocation is written to cli_invocations. Default off — recording the
# operator's behavior without consent violates least surprise.
cli_log = false

# How many days of cli_invocations rows to retain. Rows older than this
# are pruned statelessly on the capture write path. No last-prune
# bookkeeping is stored anywhere.
retention_days = 90

[introspection.transcripts]
# Each adapter may be disabled independently. An empty path selects the
# built-in vendor location; a non-empty path is an operator override.
claude_enabled = true
claude_path = ""
codex_enabled = true
codex_path = ""
copilot_enabled = true
copilot_path = ""

# Per-association overrides. Keys here shadow the top-level sections when
# the named association is in active scope. Slug is the association.slug.
#
# [associations."org:acme"]
# # Used by ADR-0006's zero-repo fallback path.
# github_lead_repo = "acme/platform"
# # Pick a custom template set under templates/<set>/. Falls through to
# # templates.default_set when unset.
# default_template_set = "acme-internal"
#
# [associations."org:acme".external.jira.status]
# # Per-association status overrides.
# done = "Closed"
