# Release pipeline (plan 1122, task rel-release-workflow; tech spec 677, "The
# release pipeline"; decisions 1323, 1337, 1338). It runs on a pushed stable
# vMAJOR.MINOR.PATCH tag and nothing else: not a branch, not a pull request, not
# a pre-release tag. Releases are cut locally with `make release-cut` until
# hosted CI returns (decision 1337); this workflow is the same contract in CI,
# using the same scripts and the same evidence files, and invents no second one
# (docs/operations.md, "Release Gate Evidence").
#
# Shape: one job per platform builds the bundle from the resolved tag commit and
# runs that platform's portable and clean-host gates BEFORE it uploads anything;
# the final job `needs` both, downloads each platform into its own directory and
# runs scripts/release-publish.sh, the only step that calls `gh release`. A
# failed, skipped or missing platform job therefore publishes nothing, and the
# publisher re-validates the evidence it downloaded. tests: scripts/release-workflow.test.py.
name: Release

on:
  push:
    tags:
      # GitHub filter syntax, not a regex: [0-9]+ is one or more digits. A tag
      # such as v1.2.3-rc1 does not match. The publisher refuses it as well.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Nothing can read or write more than the repository contents by default; the
# publisher job alone is granted contents: write.
permissions:
  contents: read

# One release run per tag, and a release is never cancelled half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macos-arm64 bundle and gates
    # The OS floor of the macOS bundle is 26.0 and its gates refuse any host that
    # is not Darwin-arm64.
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      PLANAR_RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out the tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify the tag, its commit and a clean checkout
        run: scripts/release-publish.sh --preflight "$TAG"
      - name: Install the build toolchain
        run: brew install cmake ninja llvm
      - name: Build the bundle (make dist)
        run: make dist
      - name: Stage the bundle for its gates
        run: |
          set -eu
          mkdir -p release-out/macos-arm64
          cp dist/planar-macos-arm64.tar.gz dist/planar-macos-arm64.tar.gz.gates.json dist/get-planar.sh release-out/macos-arm64/
      - name: Run the macos-arm64 release gates
        run: scripts/release-gates.sh --platform macos-arm64 release-out/macos-arm64
      - name: Upload the gated bundle and its evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-arm64
          path: |
            release-out/macos-arm64/planar-macos-arm64.tar.gz
            release-out/macos-arm64/planar-macos-arm64.tar.gz.gates.json
            release-out/macos-arm64/get-planar.sh
            release-out/macos-arm64/planar-macos-arm64.gate-logs
          if-no-files-found: error

  linux-x86_64:
    name: linux-x86_64 bundle and gates
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      PLANAR_RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out the tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify the tag, its commit and a clean checkout
        run: scripts/release-publish.sh --preflight "$TAG"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the bundle in the Docker dist stage (make linux-dist)
        run: make linux-dist LINUX_DIST_OUT=release-out/linux-x86_64
      - name: Run the linux-x86_64 release gates
        run: scripts/release-gates.sh --platform linux-x86_64 release-out/linux-x86_64
      - name: Upload the gated bundle and its evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: |
            release-out/linux-x86_64/planar-linux-x86_64.tar.gz
            release-out/linux-x86_64/planar-linux-x86_64.tar.gz.gates.json
            release-out/linux-x86_64/get-planar.sh
            release-out/linux-x86_64/planar-linux-x86_64.gate-logs
          if-no-files-found: error

  publish:
    name: publish the release
    # Runs only when both platform jobs succeeded (the default `needs` rule).
    needs: [macos-arm64, linux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download the macos-arm64 bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-arm64
          path: release-in/macos-arm64
      - name: Download the linux-x86_64 bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-x86_64
          path: release-in/linux-x86_64
      - name: Re-validate the evidence and publish
        run: scripts/release-publish.sh "$TAG" release-in/macos-arm64 release-in/linux-x86_64
