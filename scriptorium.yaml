# Unified source roots and staging profiles for src/tools/scriptorium/.
# Source paths resolve relative to this file. install.sh invokes the built
# renderer with PLANAR_HOME as the staging root and then wires vendor installs.
sources:
  skills: skills/src
  agents: agents

vendors: [claude, codex, copilot, gemini]

# The installer consumes flat Copilot and Gemini skill files before creating
# their vendor-specific SKILL.md directories.
vendor_overrides:
  copilot:
    output_dir: skills/copilot
  gemini:
    output_dir: skills/gemini
