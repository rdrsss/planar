schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/workspace/home"]

[task]
name = "planar/clean-work-review"
description = "Bounded clean scratch work and independent review without fault injection"
authors = []
keywords = ["planar", "codex", "revision"]

[environment]
docker_image = "sha256:06e95472c9fb2a7ab49c50b0f2c87f5f1006aa33397ef17715a75164458b7ed2"
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240

[agent]
timeout_sec = 400

[verifier]
environment_mode = "separate"
timeout_sec = 60
[verifier.environment]
docker_image = "sha256:f03ecae205332adb3921400abd71c09af102b58a7843a3e5af8be926ecc5fdb6"
network_mode = "no-network"
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240

[[steps]]
name = "worker"
min_reward = 1
[steps.agent]
timeout_sec = 400
[steps.verifier]
timeout_sec = 60
[steps.verifier.env]
PLANAR_CLEAN_PHASE = "worker"

[[steps]]
name = "review"
[steps.agent]
timeout_sec = 400
[steps.verifier]
timeout_sec = 60
[steps.verifier.env]
PLANAR_CLEAN_PHASE = "review"
