# The minimal profile; references/profiles.md defines the format.
version: 1
name: minimal
description: The session drives one task at a time with a worker, checks and one reviewer.
driver: session
parallel: false
stages:
  implement:
    agent: worker
  check: {}
  review:
    reviewers:
      - { agent: reviewer, focus: all }
limits:
  revisions: none
  stall: 2
